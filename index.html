<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <title>ANØXIC DAMAGE</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const supabaseUrl = 'https://ldedbfknquyvcwfiskqe.supabase.co';
        const supabaseKey = 'DEIN_PUBLISHABLE_KEY';

        const supabaseClient = supabase.createClient(
            supabaseUrl,
            supabaseKey
        );
    </script>
</head>

<body>

    <h1>ANØXIC DAMAGE</h1>

    <p>WELCOME TO THE ANØXIC DAMAGE HEALING SOCIETY (ADHS)</p>

    <p>SNAP BACK TO REALITY.</p>

    <p>AKTUELL ONLINE: <span id="online-count">0</span> PERSONEN</p>

    <script>
        const visitorId = crypto.randomUUID();

        async function updatePresence() {
            await supabaseClient
                .from('online_users')
                .upsert({
                    id: visitorId,
                    last_seen: new Date().toISOString()
                });

            const thirtyMinutesAgo = new Date(
                Date.now() - 30 * 60 * 1000
            ).toISOString();

            const { count } = await supabaseClient
                .from('online_users')
                .select('*', { count: 'exact', head: true })
                .gte('last_seen', thirtyMinutesAgo);

            document.getElementById('online-count').textContent = count || 0;
        }

        updatePresence();

        setInterval(updatePresence, 30000);
    </script>
